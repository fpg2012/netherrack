# 站点与运行时配置。
# 优先级：环境变量 > backend/.env > 本文件 > config.py 里的默认值。
# 密钥类（DATABASE_URL、JWT_SECRET）只放 .env，不要写在这里。

# ---- 站点 ----
app_name = "netherrack"
# 展示用时区（数据库统一存 UTC）
timezone = "Asia/Shanghai"
# 默认板块：填标签的 slug，发帖时默认勾上；留空则不预选
default_tag = "tea"
# dev | production：production 会强制校验 cookie_secure / cors_origins
env = "dev"
# true 时开放 /api/docs 和 /api/openapi.json
debug = false

# ---- 会话 ----
access_token_ttl = 900          # 15 分钟
refresh_token_ttl = 604800      # 7 天
cookie_secure = false           # 走 HTTPS 时必须 true（production 强制）
cookie_samesite = "lax"

# ---- 网络 ----
cors_origins = ["http://localhost:5173"]
# 部署在 nginx 后面时设 true，限流才按真实客户端 IP 计数
trust_proxy = false

# ---- 上传 ----
upload_max_bytes = 5242880    # 附件单个文件上限：5 MB
avatar_max_bytes = 2097152    # 头像上限：2 MB

# ---- 分页 ----
page_size = 20
max_page_size = 100

# ---- 路径（相对 backend/）----
assets_dir = "../data/public/assets"
legacy_dump = "../data/flarum-2026-10-23.sql.gz"
